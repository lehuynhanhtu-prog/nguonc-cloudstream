name: Build and publish NguonC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nguonc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build extension and plugin manifest
        run: gradle make makePluginsJson --stacktrace

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          find . -type f -name '*.cs3' -exec cp {} publish/ \;
          find . -type f -path '*/build/*.jar' -exec cp {} publish/ \;
          cp build/plugins.json publish/plugins.json
          cp repo.json publish/repo.json
          test -n "$(find publish -name '*.cs3' -print -quit)"
          test -s publish/plugins.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nguonc-extension-build
          path: publish/

      - name: Publish builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./publish
          force_orphan: true


  android-e2e-vn:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP to SOCKS proxy bridge
        run: python -m pip install --disable-pip-version-check pproxy

      - uses: actions/download-artifact@v4
        with:
          name: nguonc-extension-build
          path: /tmp/nguonc-build

      - name: Download official CloudStream 4.8.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/recloudstream/cloudstream/releases/download/v4.8.0/4.8.0.apk \
            -o /tmp/cloudstream.apk
          echo "348c3f09551f2dda4fba25ba348928ee7b82a47ce98a6b1eae3295d4c127877c  /tmp/cloudstream.apk" | sha256sum -c -

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Run v6 inside official CloudStream via verified VN egress
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLOUDSTREAM_APK: /tmp/cloudstream.apk
          PLUGIN_CS3: /tmp/nguonc-build/NguonC.cs3
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 480
          script: bash scripts/run_android_cloudstream_e2e_v6.sh
