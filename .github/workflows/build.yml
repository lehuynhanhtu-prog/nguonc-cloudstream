name: Android API 30 live-test NguonC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nguonc-android30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-cloudstream-e2e-api30:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP to SOCKS proxy bridge
        run: python -m pip install --disable-pip-version-check pproxy

      - name: Find a live Viet Nam egress
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/find_working_vn_proxy.sh
          scripts/find_working_vn_proxy.sh

      - name: Download official CloudStream 4.8.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/recloudstream/cloudstream/releases/download/v4.8.0/4.8.0.apk \
            -o /tmp/cloudstream.apk
          echo "348c3f09551f2dda4fba25ba348928ee7b82a47ce98a6b1eae3295d4c127877c  /tmp/cloudstream.apk" | sha256sum -c -

      - name: Run released cs3 inside official CloudStream Android API 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLOUDSTREAM_APK: /tmp/cloudstream.apk
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 480
          script: |
            set -euo pipefail
            proxy="$(cat /tmp/working_vn_proxy)"
            remote="${proxy/socks5h:\/\//socks5:\/\/}"
            pproxy -l http://0.0.0.0:8899 -r "$remote" > /tmp/pproxy.log 2>&1 &
            bridge_pid=$!

            for i in {1..20}; do
              trace="$(curl -kfsS -x http://127.0.0.1:8899 --max-time 8 https://www.cloudflare.com/cdn-cgi/trace || true)"
              if echo "$trace" | grep -q '^loc=VN$'; then
                break
              fi
              sleep 1
            done
            echo "$trace" | grep -E '^(ip|loc|colo|warp)='
            echo "$trace" | grep -q '^loc=VN$'

            python scripts/android_cloudstream_e2e.py
            kill "$bridge_pid" || true
