name: Build and publish NguonC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nguonc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build extension and plugin manifest
        run: gradle make makePluginsJson --stacktrace

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          find . -type f -name '*.cs3' -exec cp {} publish/ \;
          find . -type f -path '*/build/*.jar' -exec cp {} publish/ \;
          cp build/plugins.json publish/plugins.json
          cp repo.json publish/repo.json
          test -n "$(find publish -name '*.cs3' -print -quit)"
          test -s publish/plugins.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nguonc-extension-build
          path: publish/

      - name: Publish builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./publish
          force_orphan: true

  runtime-smoke:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Live NguonC end-to-end test
        run: python scripts/runtime_e2e.py


  runtime-smoke-warp:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Install and connect Cloudflare WARP
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp+doh
          warp-cli --accept-tos connect
          for i in {1..20}; do
            if curl -fsS https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'; then
              curl -fsS https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|colo|warp)='
              exit 0
            fi
            sleep 2
          done
          warp-cli --accept-tos status || true
          exit 1
      - name: Live NguonC end-to-end test over WARP
        run: python scripts/runtime_e2e.py

  runtime-smoke-vn-vpn:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check cryptography
          sudo apt-get update
          sudo apt-get install -y openvpn
      - name: Connect to a public VPN Gate relay in Viet Nam
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          python - <<'PY'
          import base64, csv, io
          raw = open('/tmp/vpngate.csv', encoding='utf-8-sig', errors='replace').read()
          rows = []
          for line in raw.splitlines():
              if not line or line.startswith('*'):
                  continue
              if line.startswith('#HostName'):
                  header = line[1:].split(',')
                  continue
              if 'header' not in globals():
                  continue
              try:
                  vals = next(csv.reader([line]))
              except Exception:
                  continue
              if len(vals) != len(header):
                  continue
              d = dict(zip(header, vals))
              if d.get('CountryShort') == 'VN' and d.get('OpenVPN_ConfigData_Base64'):
                  try:
                      d['_score'] = int(d.get('Score') or 0)
                  except Exception:
                      d['_score'] = 0
                  rows.append(d)
          if not rows:
              raise SystemExit('No Viet Nam VPN Gate OpenVPN relay available')
          rows.sort(key=lambda x: x['_score'], reverse=True)
          d = rows[0]
          cfg = base64.b64decode(d['OpenVPN_ConfigData_Base64']).decode('utf-8', 'replace')
          cfg = cfg.replace('auth-user-pass\n', 'auth-user-pass /tmp/vpn-auth.txt\n')
          open('/tmp/vpn.ovpn','w').write(cfg)
          open('/tmp/vpn-auth.txt','w').write('vpn\nvpn\n')
          print('VPN_SELECTED', d.get('HostName'), d.get('IP'), d.get('Score'), d.get('Speed'))
          PY
          chmod 600 /tmp/vpn-auth.txt
          sudo openvpn --config /tmp/vpn.ovpn --auth-user-pass /tmp/vpn-auth.txt --daemon --log /tmp/openvpn.log
          ok=0
          for i in {1..30}; do
            trace="$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace || true)"
            echo "$trace" | grep -E '^(ip|loc|colo|warp)=' || true
            if echo "$trace" | grep -q '^loc=VN$'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            cat /tmp/openvpn.log || true
            exit 1
          fi
      - name: Live NguonC end-to-end test from Viet Nam
        run: python scripts/runtime_e2e.py
