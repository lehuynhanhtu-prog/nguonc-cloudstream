name: Build and live-test NguonC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nguonc-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build extension
        run: gradle make makePluginsJson --stacktrace

  runtime-smoke-vn-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Find a live Viet Nam egress that NguonC accepts
        shell: bash
        run: |
          chmod +x scripts/find_working_vn_proxy.sh
          scripts/find_working_vn_proxy.sh
      - name: Run NguonC to StreamC to HLS to media E2E
        shell: bash
        run: |
          proxy="$(cat /tmp/working_vn_proxy)"
          echo "E2E_PROXY $proxy"
          export ALL_PROXY="$proxy"
          export all_proxy="$proxy"
          python scripts/runtime_e2e.py

  android-cloudstream-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP to SOCKS proxy bridge
        run: python -m pip install --disable-pip-version-check pproxy

      - name: Verify the live-proven Viet Nam egress
        shell: bash
        run: |
          set -euo pipefail
          proxy='socks5h://117.5.251.88:5005'
          trace="$(curl -kfsS -L --max-time 10 --proxy "$proxy" https://www.cloudflare.com/cdn-cgi/trace)"
          echo "$trace" | grep -E '^(ip|loc|colo|warp)='
          echo "$trace" | grep -q '^loc=VN$'
          status="$(curl -k -sS -L --max-time 15 --proxy "$proxy" \
            -A 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36' \
            -H 'Accept: application/json,text/plain,*/*' \
            -e 'https://phim.nguonc.com/' \
            -o /tmp/android-egress-probe.json -w '%{http_code}' \
            'https://phim.nguonc.com/api/films/phim-moi-cap-nhat?page=1')"
          test "$status" = "200"
          grep -q '"items"' /tmp/android-egress-probe.json
          printf '%s' "$proxy" > /tmp/working_vn_proxy

      - name: Download official CloudStream 4.8.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/recloudstream/cloudstream/releases/download/v4.8.0/4.8.0.apk \
            -o /tmp/cloudstream.apk
          echo "348c3f09551f2dda4fba25ba348928ee7b82a47ce98a6b1eae3295d4c127877c  /tmp/cloudstream.apk" | sha256sum -c -

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Run released cs3 inside official CloudStream Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLOUDSTREAM_APK: /tmp/cloudstream.apk
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run_android_cloudstream_e2e.sh
