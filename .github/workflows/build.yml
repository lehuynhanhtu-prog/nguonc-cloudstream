name: Android API 30 live-test NguonC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nguonc-android30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-cloudstream-e2e-api30:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP to SOCKS proxy bridge
        run: python -m pip install --disable-pip-version-check pproxy

      - name: Find a live Viet Nam egress
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/find_working_vn_proxy.sh
          scripts/find_working_vn_proxy.sh

      - name: Download official CloudStream 4.8.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/recloudstream/cloudstream/releases/download/v4.8.0/4.8.0.apk \
            -o /tmp/cloudstream.apk
          echo "348c3f09551f2dda4fba25ba348928ee7b82a47ce98a6b1eae3295d4c127877c  /tmp/cloudstream.apk" | sha256sum -c -

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Run released cs3 inside official CloudStream Android API 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLOUDSTREAM_APK: /tmp/cloudstream.apk
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 480
          script: bash scripts/run_android_cloudstream_e2e.sh
