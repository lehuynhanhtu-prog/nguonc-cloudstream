name: Build and live-test NguonC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nguonc-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build extension
        run: gradle make makePluginsJson --stacktrace

  runtime-smoke-vn-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Find a live Viet Nam egress that NguonC accepts
        shell: bash
        run: |
          chmod +x scripts/find_working_vn_proxy.sh
          scripts/find_working_vn_proxy.sh
      - name: Run NguonC -> StreamC -> HLS -> media E2E
        shell: bash
        run: |
          proxy="$(cat /tmp/working_vn_proxy)"
          echo "E2E_PROXY $proxy"
          export ALL_PROXY="$proxy"
          export all_proxy="$proxy"
          python scripts/runtime_e2e.py
