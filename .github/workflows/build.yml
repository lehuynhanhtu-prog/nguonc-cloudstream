name: Build and publish NguonC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nguonc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build extension and plugin manifest
        run: gradle make makePluginsJson --stacktrace

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          find . -type f -name '*.cs3' -exec cp {} publish/ \;
          find . -type f -path '*/build/*.jar' -exec cp {} publish/ \;
          cp build/plugins.json publish/plugins.json
          cp repo.json publish/repo.json
          test -n "$(find publish -name '*.cs3' -print -quit)"
          test -s publish/plugins.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nguonc-extension-build
          path: publish/

      - name: Publish builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./publish
          force_orphan: true
