name: Live NguonC runtime test

on:
  push:
    branches: [test/live-runtime]
    paths:
      - 'scripts/live_runtime_test.py'
      - '.github/workflows/live-runtime-test.yml'
  workflow_dispatch:

jobs:
  live-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install live-test dependencies
        run: python -m pip install --disable-pip-version-check "httpx[http2]" cryptography brotli

      - name: Probe NguonC API, StreamC bootstrap, HLS and first segment
        run: python scripts/live_runtime_test.py
